services:
  postgres:
    image: postgres:14.10-alpine
    container_name: lite-chat-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 1s
      retries: 10

  mongodb:
    image: mongo:latest
    container_name: lite-chat-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin_password
      MONGO_INITDB_DATABASE: messenger_messages
    ports:
      - "27017:27017"
    volumes:
      - ./mongodata:/data/db
